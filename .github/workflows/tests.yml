name: tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "frontend/**"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "frontend/**"
      - "docs/**"

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q
