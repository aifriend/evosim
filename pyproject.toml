[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evosim"
version = "0.1.0"
description = "Training general-purpose embodied agents with Gymnasium and MuJoCo"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "gymnasium[mujoco]>=1.0.0",
]

[project.optional-dependencies]
train = [
    "stable-baselines3>=2.4.0",
    "tensorboard>=2.16.0",
]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
include = ["evosim*"]

[tool.setuptools.package-data]
evosim = ["envs/assets/*.xml"]
